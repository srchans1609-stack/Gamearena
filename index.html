<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameArena -> Panel del administrador</title>
    <!-- Es la parte donde traigo los diseños del bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <!-- preparo el lienzo donde voy a poner el contenido -->
<body class="p-4 bg-light">
    <div class="container">
    <!--Creo el header con el titulo a la izquierda con el fondo oscuro el texto en blanco -->
        <header class="d-flex justify-content-between align-items-center p-3 bg-dark text-white rounded mb-3">
            <h1 class="h4 m-0">GameArena</h1>
            <span id="conexion" class="badge bg-secondary">Sin conectar</span>
        </header>
    <!--Creo la zona de aviso con el warning-->
        <div id="aviso" class="alert alert-warning mb-4" role="alert">
            zona de avisos (verde, amarillo o rojo)
        </div>
    <!--Crea un menú de navegación por pestañas (tabs)-->
        <ul class="nav nav-tabs mb-4" id="navTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-torneos" type="button">Torneos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link active" id="tabJugadores" data-bs-toggle="tab" data-bs-target="#panel-jugadores" type="button">Jugadores</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-videojuegos" type="button">Videojuegos</button>
      </li>
    </ul>
    <!-- Aquí empieza el contenido de las pestañas -->
    <div class="tab-content">

        <!--Pestaña de Jugadores-->
        <div class="tab-pane fade show active" id="panel-jugadores" role="tabpanel">
        
        <div class="card p-3 mb-4">
          <h5>Buscador Jugadores</h5>
          <div class="d-flex gap-2 mb-2">
            <input type="number" id="buscarJugadorId" class="form-control" style="width: 150px;" placeholder="ID">
            <!-- GET /jugadores/{id}: buscar un jugador por su ID -->
            <button type="button" id="btnBuscarJugador" class="btn btn-primary">Buscar</button>
          </div>
          <div id="resJugador" class="mb-3"></div>
          <!---->
          <table class="table table-bordered">
            <thead class="table-dark">
                <tr><th>ID</th>
                <th>Nick</th>
                <th>Email</th>
                <th>Nivel</th>
                <th>Acciones</th></tr>
            </thead>
            <tbody id="cuerpoJugadores">
              <!-- GET /jugadores: aquí se pintarán los jugadores -->
              <!-- Botones por fila: 
                   - GET /jugadores/{id}/participaciones: torneos del jugador
                   - PUT /jugadores/{id}: editar jugador
                   - DELETE /jugadores/{id}: eliminar jugador -->
            </tbody>
          </table>
        </div>
        </div>
    </div>
    

    <!-- Ocupa la mitad de la pantalla (6 de 12 columnas) -->
  <div class="col-md-6">
    <!-- Crea un recuadro estilo tarjeta card-->
    <div class="card p-3">
      <h5>Crear Jugador</h5>
      
      <form id="formJugador">
        <!-- Campos de entrada para Nick, Email y Nivel. form-control les da el estilo de Bootstrap y -->
        <input type="text" id="jNick" class="form-control mb-2" placeholder="Nick">
        <input type="email" id="jEmail" class="form-control mb-2" placeholder="Email">
        <input type="number" id="jNivel" class="form-control mb-3" placeholder="Nivel">
        
        <!-- POST /jugadores: crear jugador -->
        <!-- Botón para enviar (submit). Es verde y ocupa todo el ancho de la tarjeta-->
        <button type="submit" id="btnJugador" class="btn btn-success w-100">Guardar</button>
      </form>
    </div>
  </div>
          
          <!-- Ocupa la otra mitad de la pantalla -->
  <div class="col-md-6">
    <!-- Tarjeta idéntica a la anterior, pero tiene el atributo hidden.  -->
    <div id="panelTorneosJugador" class="card p-3" hidden>
      <h5 id="tituloTorneosJugador">Torneos del jugador</h5>
      
      <!-- Contenedor vacío para inyectar los datos de los torneos que devuelva el Backend que aahora no esta conectado-->
      <div id="listaTorneosJugador"></div>
    </div>
  </div>
  <!--Fin de la pestaña jugador-->
  <!--Pestaña de Videojuegos-->
  <div class="card p-3 mb-4">
    <h5>Videojuegos</h5>
    
    <!-- Contenedor flexible para poner el input y el botón en la misma línea, con una separación entre ellos  -->
    <div class="d-flex gap-2 mb-2">
      <!-- Input para buscar un juego por su ID. Tiene un ancho fijo de 150px para no ocupar toda la pantalla -->
      <input type="number" id="buscarJuegoId" class="form-control" style="width: 150px;" placeholder="ID">
      
      <!-- GET /videojuegos/{id}: buscar un videojuego por ID -->
      <!-- Botón azul (btn-primary) -->
      <button type="button" class="btn btn-primary">Buscar</button>
    </div>
    
    <!-- Contenedor vacío donde puede inyectar el resultado de la búsqueda individual  -->
    <div id="resJuego" class="mb-3"></div>

    <!-- Tabla con bordes (table-bordered) para mostrar todos los juegos registrados -->
    <table class="table table-bordered">
      <!-- Cabecera de la tabla con fondo oscuro (table-dark) -->
      <thead class="table-dark">
        <tr><th>ID</th><th>Título</th><th>Género</th><th>Plataforma</th></tr>
      </thead>
      
      <!-- GET /videojuegos: aquí se pintarán los videojuegos -->
      <!-- El cuerpo de la tabla está vacío. -->
      <tbody id="cuerpoJuegos">
      </tbody>
    </table>
  </div>
              
       <!-- Otra tarjeta, pero esta ocupa solo la mitad del ancho de su contenedor para que no se estire demasiado -->
    <div class="card p-3 w-50">
    <h5>Crear Videojuego</h5>
    
    <form id="formJuego">
      <!-- Campos de texto estándar de Bootstrap para recoger los datos del nuevo juego -->
      <input type="text" id="juegoTitulo" class="form-control mb-2" placeholder="Título">
      <input type="text" id="juegoGenero" class="form-control mb-2" placeholder="Género">
      <input type="text" id="juegoPlataforma" class="form-control mb-3" placeholder="Plataforma">
      
      <!-- POST /videojuegos: crear videojuego -->
      <!-- Botón verde de guardado que ocupa todo el ancho disponible de la tarjeta (w-100) -->
      <button type="submit" class="btn btn-success w-100">Guardar</button>
    </form>
  </div>
  <!-- Fin dela pestaña de videojuegos -->
   <!-- Pestaña de Torneos -->
   <div class="tab-pane fade" id="panel-torneos" role="tabpanel">
        
        <!-- Tarjeta (card) que envuelve todo el bloque de filtros y la tabla -->
        <div class="card p-3 mb-4">
          <!-- Contenedor flexible para alinear los inputs en horizontal.-->
    <div class="d-flex gap-2 mb-3">
      
      <!-- Desplegable para filtrar por el estado del torneo -->
      <select id="filtroEstado" class="form-select w-auto">
        <option value="">Estado...</option>
        <option value="ABIERTO">ABIERTO</option>
        <option value="EN_CURSO">EN_CURSO</option>
        <option value="FINALIZADO">FINALIZADO</option>
      </select>
      
      <!-- Desplegable de videojuegos -->
      <select id="filtroJuego" class="form-select w-auto">
        <option value="">Videojuego...</option>
      </select>
      
      <!-- GET /torneos: filtrar torneos -->
      <button type="button" id="btnFiltrarTorneos" class="btn btn-secondary">Filtrar</button>
      
      <!-- Input para buscar un torneo concreto le mete un poco de espacio extra a la izquierda para separarlo visualmente del bloque de filtros. -->
      <input type="number" id="buscarTorneoId" class="form-control ms-3" style="width: 120px;" placeholder="ID">
      
      <!-- GET /torneos/{id}: buscar torneo -->
      <!-- Botón azul (btn-primary) exclusivo para la búsqueda directa por ID -->
      <button type="button" class="btn btn-primary">Buscar</button>
    </div>

          <table class="table table-bordered">
            <thead class="table-dark">
              <tr><th>ID</th><th>Nombre</th><th>Estado</th><th>Videojuego</th><th>Acciones</th></tr>
            </thead>
            <tbody id="cuerpoTorneos">
              <!-- GET /torneos: lista de torneos -->
              <!-- Botones por fila:
                   - GET /torneos/{id}/participaciones: participantes del torneo
                   - PUT /torneos/{id}: editar torneo
                   - DELETE /torneos/{id}: eliminar torneo -->
            </tbody>
          </table>
        </div>


</div>
</body>
</html>
